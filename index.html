<script>
// Dynamic pattern animation
document.addEventListener('DOMContentLoaded', function() {
    // Mousemove effect for dynamic pattern responsiveness
    document.addEventListener('mousemove', function(e) {
        // Get the geometric pattern elements
        const geoElements = document.querySelectorAll('.geo-element');
        
        // Calculate mouse position relative to the center of the screen
        const mouseX = e.clientX - window.innerWidth / 2;
        const mouseY = e.clientY - window.innerHeight / 2;
        
        // Apply subtle movement to each geometric element based on mouse position
        geoElements.forEach((element, index) => {
            const factor = (6 - index) * 0.01; // More movement for larger elements
            const translateX = mouseX * factor;
            const translateY = mouseY * factor;
            element.style.transform = `translate(${translateX}px, ${translateY}px) ${element.classList.contains('geo-square') ? 'rotate(45deg)' : ''}`;
        });
    });
});
</script>
